name: CI Build & Sign (Flutter)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution:  zulu 
          java-version:  17 

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version:  3.44.9 
          channel:  stable 

      - name: Install dependencies
        run: flutter pub get

      # Temporary patch step (runs after pub get) to avoid flutter_inappwebview_android evaluation errors in CI
      - name: Patch flutter_inappwebview_android for CI (temporary)
        run: |
          set -e
          PUB_CACHE="$HOME/.pub-cache/hosted/pub.dev"
          echo "Searching for flutter_inappwebview_android in $PUB_CACHE..."
          for d in "$PUB_CACHE"/flutter_inappwebview_android-*; do
            if [ -d "$d/android" ]; then
              echo "Patching $d/android/build.gradle ..."
              cp "$d/android/build.gradle" "$d/android/build.gradle.bak" || true
              sed -i  /org.jetbrains.kotlin.android/ s/^/\\/\\/ /  "$d/android/build.gradle" || true
              sed -i  /kotlinOptions/ s/^/\\/\\/ /  "$d/android/build.gradle" || true
            fi
          done

      - name: Decode keystore (from secret)
        if: ${{ secrets.KEYSTORE_BASE64 !=    }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.keystore
          ls -l android/keystore

      - name: Write key.properties for Gradle signing
        if: ${{ secrets.KEYSTORE_BASE64 !=    }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=keystore/release.keystore
          EOF
          echo "Created android/key.properties:"
          sed -n  1,20p  android/key.properties

      - name: Build App Bundle (release)
        run: flutter build appbundle --release -v

      - name: Upload artifact (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
        
