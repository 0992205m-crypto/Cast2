name: Ultimate Comprehensive Magic Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # السحر الأول: سحق مجلد أندرويد القديم المسبب لخطأ الـ V1 Embedding وإعادة توليده بطراز V2 الحديث
      - name: Kill V1 Embedding and Recreate Android
        run: |
          rm -rf android
          flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      # السحر الثاني: تعديل ملف مكتبة الـ Webview المكسور داخل كاش السيرفر قبل البناء
      - name: Magic Fix for InAppWebView Proguard Error
        run: |
          echo "Applying magic fix to flutter_inappwebview_android..."
          find /home/runner/.pub-cache/ -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +

      # البناء النهائي المستقر
      - name: Build Release APK
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
