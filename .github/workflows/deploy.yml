name: Absolute Final Bulletproof Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب ملفات المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد جافا 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      # 3. إعداد فلاتر المستقرة
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 4. التخلص من الهيكلية القديمة وتوليد أندرويد حديث (حل مشكلة v1 embedding)
      - name: Recreate Modern Android Folder
        run: |
          rm -rf android
          flutter create --platforms=android .

      # 5. تحميل مكاتب المشروع
      - name: Install dependencies
        run: flutter pub get

      # 6. فرض إصدار الـ SDK المطلوب للمتجر (34) برمجياً على المجلد الجديد والمكتبات
      - name: Force SDK 34 Configurations
        run: |
          cat << EOF >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdk = 34
                          defaultConfig {
                              targetSdk = 34
                          }
                      }
                  }
              }
          }
          EOF

      # 7. البناء النهائي التلقائي للنسخة النهائية
      - name: Build Release APK
        run: flutter build apk --release --ignore-deprecation --no-tree-shake-icons

      # 8. رفع ملف الـ APK النهائي والناجح تماماً
      - name: Upload Ultimate APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-success-apk
          path: build/app/outputs/flutter-apk/app-release.apk
