name: Ultimate Magic Flutter Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # ✨ التعويذة السحرية: تعديل ملف المكتبة المكسور مباشرة داخل كاش السيرفر قبل البناء
      - name: Magic Fix for InAppWebView Proguard Error
        run: |
          echo "Applying magic fix to flutter_inappwebview_android..."
          TARGET_FILE="/home/runner/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-1.1.3/android/build.gradle"
          if [ -f "$TARGET_FILE" ]; then
            sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' "$TARGET_FILE"
            echo "Successfully fixed line 44!"
          else
            echo "File not found yet, trying a broader search..."
            find /home/runner/.pub-cache/ -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +
          fi

      - name: Build Release APK
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
