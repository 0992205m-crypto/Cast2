name: Flutter Build APK and Web

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android project with supported Gradle
        run: |
          set -e
          # create a temporary Flutter app to get a clean android/ layout
          flutter create -t app temp_app --platforms android --project-name cast2

          # backup current android folder if it exists
          if [ -d android ]; then mv android android.bak; fi

          # move generated android folder into repo root
          mv temp_app/android .

          # restore key.properties or keystore if they existed in the backup
          if [ -f android.bak/key.properties ]; then mv android.bak/key.properties android/ || true; fi
          if ls android.bak/*.jks 1> /dev/null 2>&1; then mkdir -p android/app && mv android.bak/*.jks android/app/ || true; fi

          # (optional) restore custom native files from backup if you have them
          # cp -R android.bak/app/src/main/kotlin/com/yourpackage/* android/app/src/main/kotlin/com/yourpackage/ || true

          # cleanup temporary project
          rm -rf temp_app
          # keep android.bak for inspection; remove it explicitly if you want
          # rm -rf android.bak

      - name: Install dependencies
        run: flutter pub get

      # إصلاح مشكلة proguard القديمة تلقائياً
      - name: Fix Proguard in Cached Libraries
        run: |
          find /home/runner/.pub-cache/ -name "build.gradle" -type f -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +

      # إجبار المكتبات على استخدام compileSdk = 36
      - name: Force Upgrade CompileSdk to 36 everywhere
        run: |
          find /home/runner/.pub-cache/ -name "build.gradle" -type f -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} +
          find /home/runner/.pub-cache/ -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' {} +
          find android/ -name "build.gradle*" -type f -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} +
          find android/ -name "build.gradle*" -type f -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' {} +

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Configure Project for Web
        run: flutter create . --platforms web --project-name cast2

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

  deploy-web:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
