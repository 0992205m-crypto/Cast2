name: Flutter Build APK and Web

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel:  stable 

      - name: Configure Project for Android
        run: flutter create . --platforms android --project-name cast2

      - name: Install dependencies
        run: flutter pub get

      # بناء ملف الـ APK للأندرويد مباشرة وبشكل آمن
      - name: Build APK
        run: flutter build apk --release

      # حفظ ملف الـ APK داخل جيت هوب للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # تهيئة وبناء نسخة الويب
      - name: Configure Project for Web
        run: flutter create . --platforms web --project-name cast2

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path:  build/web 

  deploy-web:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
