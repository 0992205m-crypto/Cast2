name: Absolute Final Bulletproof Build 2026

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب ملفات المشروع من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد جافا 17 (النسخة القياسية لبيئات أندرويد الحديثة)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      # 3. إعداد فلاتر المستقرة
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 4. تأكد من وجود مجلد android — لا تمسح مجلد android الملتزم في المستودع
      - name: Ensure Android folder exists
        run: |
          if [ -d android ]; then
            echo "android/ exists — skipping flutter create"
          else
            flutter create --platforms=android .
          fi
      # 5. تحميل مكاتب المشروع
      - name: Install dependencies
        run: flutter pub get

      # 6. إصلاح ملفات الـ Proguard المكسورة داخل الكاش للمكتبات الخارجية
      - name: Fix Proguard Files in Pub Cache
        run: |
          echo "Fixing proguard-android.txt issue in pub-cache..."
          find /home/runner/.pub-cache/ -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +
      # 7. إعادة تطبيق خصائص Gradle الخاصة بالـ CI لمنع watcher ومشاكل KGP
      - name: Reapply CI android/gradle.properties
        run: |
          mkdir -p android
          cat > android/gradle.properties <<'EOF'
# Gradle properties for CI
# Disable Gradle file watching to avoid "Already watching path" errors in CI
org.gradle.vfs.watch=false
