name: Absolute Final Bulletproof Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب ملفات المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد جافا 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      # 3. إعداد فلاتر المستقرة
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 4. التخلص من الهيكلية القديمة وتوليد أندرويد حديث
      - name: Recreate Modern Android Folder
        run: |
          rm -rf android
          flutter create --platforms=android .

      # 5. تحميل مكاتب المشروع
      - name: Install dependencies
        run: flutter pub get

      # 6. إصلاح ملفات الـ Proguard المكسورة داخل الكاش لكل المكتبات
      - name: Fix Proguard Files in Pub Cache
        run: |
          echo "Fixing proguard-android.txt issue in pub-cache..."
          find /home/runner/.pub-cache/ -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +

      # 7. فرض إصدار الـ SDK 36 لحل تعارض مكتبة ExoPlayer الحديثة
      - name: Force SDK 36 Configurations
        run: |
          cat << EOF >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdk = 36
                          defaultConfig {
                              targetSdk = 35
                          }
                      }
                  }
              }
          }
          EOF

      # 8. البناء النهائي التلقائي للنسخة النهائية
      - name: Build Release APK
        run: flutter build apk --release --ignore-deprecation --no-tree-shake-icons

      # 9. رفع ملف الـ APK النهائي والناجح تماماً
      - name: Upload Ultimate APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-success-apk
          path: build/app/outputs/flutter-apk/app-release.apk
