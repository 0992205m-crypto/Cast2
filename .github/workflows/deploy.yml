name: Flutter Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب ملفات المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد جافا 17 (الحل الجذري لمشكلة تعارض الـ SDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. إعداد فلاتر المستقرة
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. تحميل الحزم والمكتبات
      - name: Install dependencies
        run: flutter pub get

      # 5. تنظيف الكاش القديم تماماً
      - name: Clean project cache
        run: flutter clean

      # 6. بناء نسخة الـ APK النهائية
      - name: Build Release APK
        run: flutter build apk --release

      # 7. رفع ملف الـ APK لتنزيله على هاتفك
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
