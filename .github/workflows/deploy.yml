name: Absolute Final Bulletproof Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب ملفات المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد جافا 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد فلاتر المستقرة
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. سحق مجلد أندرويد القديم وتوليد مجلد نظيف
      - name: Kill V1 Embedding and Recreate Android
        run: |
          rm -rf android
          flutter create --platforms=android .

      # 5. تحميل مكاتب المشروع
      - name: Install dependencies
        run: flutter pub get

      # 6. ⚔️ الحقن الصارم والنهائي لـ SDK 36 وإصلاح Proguard رغماً عن أي مكتبة
      - name: Global Injection Fix
        run: |
          echo "Overriding all project specifications globally..."
          
          # تعديل ملف build.gradle الرئيسي بشكل صارم جداً لفرض إصدار 36 على كل شيء (حتى المكاتب الخارجية)
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          subprojects {
              subprojects {
                  afterEvaluate { project ->
                      if (project.hasProperty('android')) {
                          project.android {
                              compileSdk = 36
                              buildToolsVersion = "36.0.0"
                              defaultConfig {
                                  targetSdk = 36
                              }
                          }
                      }
                  }
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # تعديل إجباري لملف التطبيق الداخلي ليكون 36
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle
          sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle

          # تنظيف وإصلاح ملفات الـ Proguard المكسورة في الكاش بأكمله
          find /home/runner/.pub-cache/ -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +

      # 7. البناء النهائي المستقر والتلقائي
      - name: Build Release APK
        run: flutter build apk --release --no-pub --ignore-deprecation --no-tree-shake-icons

      # 8. رفع ملف الـ APK النهائي والناجح تماماً
      - name: Upload Ultimate APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-success-apk
          path: build/app/outputs/flutter-apk/app-release.apk
