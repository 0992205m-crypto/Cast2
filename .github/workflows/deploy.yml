name: Flutter Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد جافا 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. إعداد فلاتر المستقرة
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. تحميل مكاتب المشروع 
      - name: Install dependencies
        run: flutter pub get

      # 5. تنظيف الكاش
      - name: Clean project cache
        run: flutter clean

      # 6. البناء الإجباري وتجاوز أخطاء الإصدارات القديمة (الحل الجذري للمشكلة)
      - name: Build Release APK (Ignore Deprecation)
        run: flutter build apk --release --ignore-deprecation

      # 7. رفع ملف الـ APK النهائي للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
