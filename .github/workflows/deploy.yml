name: Build Cast2 Pro APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Fix Pubspec Project Name Case
        run: |
          if [ -f pubspec.yaml ]; then
            sed -i 's/name: .*/name: cast2/g' pubspec.yaml
          fi

      - name: Force Clean & Fresh Android Initialization
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example --project-name cast2 .

      - name: Install dependencies
        run: flutter pub get

      - name: Fix InAppWebView Android Proguard Bug
        run: |
          find /home/runner/.pub-cache/ -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +

      - name: Inject Android Permissions & Network Security
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"\/>\n    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" \/>' $MANIFEST_PATH
          sed -i 's/<application/& android:usesCleartextTraffic="true"/' $MANIFEST_PATH

      - name: Configure Android Build Properties
        run: |
          cd android
          echo "android.lifecycle.compiler.incremental=true" >> local.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build Release APK
        run: flutter build apk --release --no-shrink --suppress-analytics

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cast2-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
