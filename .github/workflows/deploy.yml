name: Absolute Final Bulletproof Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب ملفات المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد جافا 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      # 3. إعداد فلاتر المستقرة
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 4. تحميل مكاتب المشروع
      - name: Install dependencies
        run: flutter pub get

      # 5. البناء النهائي للنسخة المستقرة (سيقوم بتوليد ملفات Gradle وبنائها تلقائياً)
      - name: Build Release APK
        run: flutter build apk --release --ignore-deprecation --no-tree-shake-icons

      # 6. رفع ملف الـ APK النهائي الناجح
      - name: Upload Ultimate APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-success-apk
          path: build/app/outputs/flutter-apk/app-release.apk
