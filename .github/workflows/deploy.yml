name: Absolute Final Bulletproof Build 2026

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب ملفات المشروع من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد جافا 17 (النسخة القياسية لبيئات أندرويد الحديثة)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      # 3. إعداد فلاتر المستقرة
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 4. التخلص من الهيكلية القديمة وتوليد أندرويد حديث يدعم v2 Embedding
      - name: Recreate Modern Android Folder
        run: |
          rm -rf android
          flutter create --platforms=android .

      # 5. تحميل مكاتب المشروع
      - name: Install dependencies
        run: flutter pub get

      # 6. إصلاح ملفات الـ Proguard المكسورة داخل الكاش للمكتبات الخارجية
      - name: Fix Proguard Files in Pub Cache
        run: |
          echo "Fixing proguard-android.txt issue in pub-cache..."
          find /home/runner/.pub-cache/ -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +

      # 7. تهيئة بيئة أندرويد لعام 2026 لفرض إصدارات الـ SDK بدون تعديل ملفات الجافا/الغرادل
      - name: Configure Android SDK Globally
        run: |
          mkdir -p android/app
          echo "android.experimental.r8.fullmode=false" >> android/gradle.properties
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties

      # 8. البناء النهائي التلقائي المستقر وتجاوز تعارض الكاش والـ Watcher والمكتبات القديمة
      - name: Build Release APK
        env:
          FLUTTER_SUPPRESS_KGP_WARNINGS: "true"
          ALLOW_DEPRECATED_KGP: "true"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.welcome=never"
        run: |
          flutter build apk --release --ignore-deprecation --no-tree-shake-icons --no-pub --no-track-widget-creation

      # 9. رفع ملف الـ APK النهائي الجاهز للتحميل
      - name: Upload Ultimate APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-success-apk
          path: build/app/outputs/flutter-apk/app-release.apk
