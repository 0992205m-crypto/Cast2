# Gradle properties for CI
# Disable Gradle file watching to avoid "Already watching path" errors in CI
org.gradle.vfs.watch=false

# Override legacy Kotlin DSL flags to avoid flutter_inappwebview plugin build error on CI
# The plugin fails when android.builtInKotlin=true and android.newDsl=false are present (or injected).
# Forcing builtInKotlin=false and newDsl=true prevents that failure. If you later migrate to built-in
# Kotlin support, remove or change these flags accordingly.
android.builtInKotlin=false
android.newDsl=true
