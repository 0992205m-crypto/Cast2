<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق البث الداخلي المباشر</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
        }
        .top-section { background-color: #1f1f1f; padding: 15px; }
        .url-input { width: 85%; padding: 12px; border: none; border-radius: 8px; background-color: #2d2d2d; color: white; font-size: 14px; text-align: left; direction: ltr; }
        .middle-section { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 15px; overflow-y: auto; }
        .demo-grid { display: flex; flex-direction: column; gap: 10px; width: 90%; margin-bottom: 20px; }
        .demo-btn { background-color: #2d2d2d; color: white; border: 1px solid #444; padding: 12px; border-radius: 8px; text-align: right; cursor: pointer; }
        .cast-btn { background-color: #00bcd4; color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 30px; width: 80%; cursor: pointer; box-shadow: 0 4px 15px rgba(0,188,212,0.4); }
        .status-box { font-size: 14px; color: #ffeb3b; margin-top: 15px; padding: 10px; background: #1f1f1f; border-radius: 8px; width: 80%; }
        .bottom-section { background-color: #1f1f1f; padding: 15px; display: flex; justify-content: space-around; border-top: 1px solid #2d2d2d; }
    </style>
</head>
<body>

    <!-- أعلى الشاشة -->
    <div class="top-section">
        <h2>بث الفيديو من داخل التطبيق 📺</h2>
        <input type="text" id="videoUrl" class="url-input" placeholder="اختر فيديو أو ضع رابطاً هنا...">
    </div>

    <!-- منتصف الشاشة -->
    <div class="middle-section">
        <div style="color:#b3b3b3; margin-bottom:10px;">اختر فيديو للتجربة الحية:</div>
        <div class="demo-grid">
            <button class="demo-btn" onclick="loadVideo('https://googleapis.com')">🎥 فيديو طبيعة (MP4)</button>
            <button class="demo-btn" onclick="loadVideo('https://mux.dev')">📺 بث مباشر حي (m3u8)</button>
        </div>

        <!-- زر البحث والبث الداخلي الحقيقي -->
        <button class="cast-btn" onclick="startInternalCast()">🔍 ابحث عن الريسيفر وابث الآن</button>
        
        <div class="status-box" id="status">الحالة: جاهز للبحث عن الأجهزة بالشبكة</div>
    </div>

    <!-- أسفل الشاشة -->
    <div class="bottom-section">
        <span style="font-size:12px; color:#aaa;">يجب اتصال الريسيفر والهاتف بنفس الواي فاي 📶</span>
    </div>

    <script>
        // تعريف متغير لطلب البث الداخلي المدمج
        let presentationRequest = null;
        let presentationConnection = null;

        function loadVideo(url) {
            document.getElementById('videoUrl').value = url;
            document.getElementById('status').innerText = 'تم اختيار الرابط! اضغط على زر البحث بالأسفل.';
        }

        // دالة البث الداخلي الحقيقي بدون الخروج من التطبيق
        function startInternalCast() {
            var videoUrl = document.getElementById('videoUrl').value;
            if(!videoUrl) {
                alert('الرجاء اختيار فيديو أولاً قبل البحث عن الأجهزة!');
                return;
            }

            document.getElementById('status').innerText = 'جاري فتح نافذة النظام الداخلية للبحث عن الريسيفر...';

            // التأكد من دعم نظام الهاتف والمتصفح لبروتوكول العرض الداخلي (Presentation API)
            if (window.PresentationRequest) {
                // نطلب من النظام فتح واجهة اختيار الأجهزة المتاحة في الشبكة للرابط المحدد
                presentationRequest = new PresentationRequest([videoUrl]);

                // بدء البحث وإظهار قائمة الأجهزة للموافق عليها من قِبل المستخدم داخل التطبيق
                presentationRequest.start()
                    .then(connection => {
                        presentationConnection = connection;
                        document.getElementById('status').innerText = 'متصل بالريسيفر بنجاح! جاري البث وتشغيل الفيديو الآن 🚀';
                        
                        connection.onclose = () => {
                            document.getElementById('status').innerText = 'تم قطع الاتصال بالريسيفر.';
                        };
                    })
                    .catch(error => {
                        document.getElementById('status').innerText = 'تم إلغاء البحث أو لم يتم العثور على أجهزة مدعومة.';
                        console.log('Error: ' + error.name);
                    });
            } else {
                document.getElementById('status').innerText = 'عذراً، هذا الهاتف أو نظام الريسيفر يتطلب تحويل التطبيق إلى APK كامل لتفعيل صلاحية الواي فاي المباشرة.';
            }
        }
    </script>

</body>
</html>
