name: cast2
description: "Ultimate Web Video Caster App with Internal Player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5 # المتصفح الذكي لكشف الفيديو
  video_player: ^2.9.2         # محرك الفيديو الأساسي
  chewie: ^1.8.5               # المشغل الداخلي الاحترافي والجميل
  http: ^1.2.2                 # لإرسال أوامر البث للريسيفرات (DLNA)
  file_picker: ^8.1.7          # لملفات الهاتف

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
